<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>resQ 2.0 — sign in</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <header class="hero">
      <div class="eyebrow">AI-native service · Reliance Digital</div>
      <h1 class="hero-title">resQ<span class="dot">2.0</span></h1>
      <p class="hero-lead">Service as the reason to buy. The agent does the routine work;
        people act only on the exceptions — all on WhatsApp.</p>
      <div class="hero-stats" id="hero-stats"></div>
    </header>

    <div class="signin">
      <div class="signin-head">
        <span class="side-sec" style="margin:0">Sign in as</span>
        <span class="muted">mock login · pick any person</span>
      </div>
      <div id="roles" class="login-roles"></div>
    </div>

    <footer class="login-foot">
      <a class="btn" href="/admin">Admin &amp; onboarding</a>
      <a class="btn" href="/demo">Combined 4-phone demo</a>
    </footer>
  </div>

  <script src="/common.js"></script>
  <script src="/login.js"></script>
</body>
</html>
